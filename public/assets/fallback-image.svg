<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fee2e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fecaca;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ef4444" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bgGradient)"/>
  
  <g filter="url(#shadow)">
    <circle cx="200" cy="120" r="60" fill="url(#iconGradient)"/>
    <path d="M200 80 L200 130 M200 145 L200 155" stroke="white" stroke-width="8" stroke-linecap="round"/>
  </g>
  
  <text x="200" y="230" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#991b1b" text-anchor="middle">File Rusak / Hilang</text>
</svg>